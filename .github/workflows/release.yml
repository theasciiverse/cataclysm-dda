# Builds Cataclysm: Dark Days Ahead for the Asciiverse catalog and as system
# packages. (Upstream's own workflows, CleverRaven's CI, are removed in this
# repository; see PATCHES.md.)
#
# For av: one archive per target, named cataclysm-dda-<target>.tar.gz, plus
# a SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Each archive holds the cataclysm program, the
# cataclysm-dda start script that av launches, the read-only data/, the
# translations in share/locale and the licences (asciiverse/stage.sh).
# For everyone else: .deb, .rpm, .apk and Arch packages from the same static
# Linux build, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v0.I-1-av.1: upstream's release, then our packaging
# release. Linux builds are fully static (Alpine, musl, ncursesw); macOS
# builds each architecture on the runner against the system ncurses.
# Terminal (curses) build only: no tiles, no sound. It is a big C++ build,
# about an hour per job on a hosted runner. No Windows build yet (see
# PATCHES.md).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: cataclysm-dda
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -e JOBS="$(nproc)" -v "$PWD":/src -w /src alpine:3.22 sh asciiverse/build.sh
          sudo chown -R "$(id -u):$(id -g)" .
          file cataclysm
          sh asciiverse/stage.sh

      - name: Smoke test
        run: |
          # the game must find its data through the start script, read the
          # translations and make its folder in the XDG data folder
          (cd /tmp && script -qec "TERM=xterm LANG=C.UTF-8 HOME=/tmp/h timeout 20 $PWD/stage/cataclysm-dda" /dev/null </dev/null || true) >smoke.log
          grep -aq "language" smoke.log || { tail -c 2000 smoke.log; exit 1; }
          ls /tmp/h/.local/share/cataclysm-dda/config

      - name: Package for av
        run: |
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          # 0.I-1 becomes 0.I.1: rpm and Arch versions cannot hold a dash
          v="${TAG#v}"; up="${v%%-av.*}"
          export VERSION="$(echo "$up" | tr - .)" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    timeout-minutes: 240
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          # msgfmt for the translations
          brew install gettext >/dev/null
          JOBS="$(sysctl -n hw.ncpu)" CC_ARCH=${{ matrix.arch }} sh asciiverse/build.sh
          file cataclysm
          otool -L cataclysm
          sh asciiverse/stage.sh

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Cataclysm: Dark Days Ahead $TAG" \
                 --notes "Cataclysm: Dark Days Ahead ${TAG%%-av.*} by CleverRaven and contributors, the terminal build with all translations, built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. See PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
